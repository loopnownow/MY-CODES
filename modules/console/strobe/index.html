<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="console-token" content="__CONSOLE_TOKEN__"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SCI Figure 1 · 研究流程图</title>
<style>
:root{--bg:#f4f1ea;--paper:#fffcf6;--ink:#1c2421;--muted:#5c6b66;--line:#d7d0c4;--accent:#0f4c5c;--warn:#9a6b12;--err:#9b2c2c;--ok:#2f6f4e;--chip:#e8efe9;--changed:#fff3cd;--draft:#e8f0fb}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
header{flex:0 0 auto;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--accent);color:#f4f1ea;padding:10px 16px}
header .meta{display:flex;flex-direction:column;gap:2px;min-width:260px}
header h1{margin:0;font-size:17px;font-weight:650;white-space:nowrap}
header .meta-line{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;opacity:.9}
header .meta-line #page-info{opacity:.85}
#draft-badge{background:var(--draft);color:var(--accent);border-radius:999px;padding:0 8px;font-weight:600}
#draft-badge[hidden]{display:none}
header .actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
header button,header select{font:inherit}
header button{padding:5px 9px}
header button.primary{background:#fff;color:var(--accent);border-color:#fff}
header select{max-width:230px}
.zoom{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.12);border-radius:8px;padding:2px 4px}
.zoom button{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);padding:2px 7px}
.zoom span{min-width:46px;text-align:center;font-size:12px}
main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(400px,460px) minmax(0,1fr)}
aside{min-height:0;overflow:auto;background:var(--paper);border-right:1px solid var(--line);padding:12px 14px 40px}
section.preview-col{display:flex;flex-direction:column;min-width:0;min-height:0;padding:10px 12px 12px}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;padding:9px 11px;background:#fff}
legend{font-size:12px;color:var(--muted);font-weight:600;padding:0 4px}
label.fld{display:block;margin:0 0 7px;font-size:12px;color:var(--muted)}
label.fld input,label.fld textarea,label.fld select{width:100%;margin-top:3px;font:inherit;color:var(--ink);background:#fbfaf7;border:1px solid var(--line);border-radius:6px;padding:5px 7px}
label.fld textarea{min-height:52px;resize:vertical}
input.num{width:100px}
#included-pp,#included-nonpp,#analyzed-pp,#analyzed-nonpp{width:100px}
#msg{min-height:18px;font-size:12px;color:var(--muted);margin:8px 0 0}
#msg.err{color:var(--err)}
.changed{background:var(--changed) !important}
.row{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin:0 0 5px}
.row input{min-width:0;flex:1 1 70px}
.row input.num{flex:0 0 82px}
.row select{flex:1 1 90px}
.row button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:6px;padding:1px 7px;cursor:pointer}
button{font:inherit;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:6px;padding:5px 9px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#canvas{flex:1 1 auto;min-height:0;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px}
#canvas-inner{position:relative;min-width:100%;min-height:100%;display:flex;align-items:center;justify-content:center}
#preview-img{display:block;margin:auto;max-width:100%;max-height:100%;width:auto;height:auto;user-select:none;-webkit-user-drag:none}
#handles{position:absolute;pointer-events:none}
.handle{position:absolute;border:1px dashed transparent;pointer-events:none;border-radius:3px}
#canvas.tune .handle{pointer-events:auto;cursor:move;border-color:rgba(15,76,92,.35)}
#canvas.tune .handle:hover{border-color:var(--accent);background:rgba(15,76,92,.05)}
.empty{color:var(--muted);font-size:13px;margin:8px 0 0}
.warn{color:var(--warn);font-size:12px;margin:6px 0 0}
.hidden{display:none !important}
</style>
</head>
<body>
<header>
  <div class="meta">
    <h1>SCI Figure 1 · 研究流程图</h1>
    <div class="meta-line">
      <span id="status">读取中…</span>
      <span id="page-info"></span>
      <span id="draft-badge" hidden></span>
    </div>
  </div>
  <div class="actions">
    <button type="button" id="btn-undo">撤销</button>
    <button type="button" id="btn-save-design">保存设计</button>
    <button type="button" class="primary" id="btn-save">保存并生成 Figure 1</button>
    <button type="button" id="btn-tune">微调版式</button>
    <button type="button" id="btn-reset">恢复默认版式</button>
    <button type="button" id="btn-discard">放弃草稿</button>
    <span class="zoom">
      <button type="button" id="btn-zoom-out">−</button>
      <span id="zoom-label">100%</span>
      <button type="button" id="btn-zoom-in">+</button>
      <button type="button" id="btn-fit">适应</button>
    </span>
    <select id="manuscript" title="子工程根目录的 .docx 手稿"></select>
    <button type="button" id="btn-fill">按手稿填写</button>
    <button type="button" id="btn-reload">重新加载</button>
  </div>
</header>

<main>
  <aside>
    <fieldset>
      <legend>筛查 screened</legend>
      <label class="fld">文本<textarea id="screened-text" rows="2"></textarea></label>
      <label class="fld">n= <input id="screened-n" class="num" type="number" min="0"/></label>
    </fieldset>

    <fieldset>
      <legend>纳入 / 排除 criteria</legend>
      <label class="fld">inclusion（每行一条）<textarea id="inclusion" rows="3"></textarea></label>
      <label class="fld">exclusion（每行一条，`Reason (n=…)`）<textarea id="exclusion" rows="3"></textarea></label>
    </fieldset>

    <fieldset>
      <legend>纳入分析 included（可选）</legend>
      <label class="fld">文本<textarea id="included-text" rows="2"></textarea></label>
      <div class="row">
        <input id="included-n" class="num" type="number" min="0" placeholder="n"/>
        <input id="included-pp" type="number" min="0" placeholder="PP n"/>
        <input id="included-nonpp" type="number" min="0" placeholder="non-PP n"/>
      </div>
    </fieldset>

    <fieldset>
      <legend>预分组 presplit</legend>
      <div id="presplit-rows"></div>
      <button type="button" id="add-presplit">+ 臂</button>
    </fieldset>

    <fieldset>
      <legend>降采样 downsample</legend>
      <div id="downsample-rows"></div>
      <button type="button" id="add-downsample">+ 降采样</button>
    </fieldset>

    <fieldset>
      <legend>最终队列 cohorts</legend>
      <div id="cohort-rows"></div>
      <button type="button" id="add-cohort">+ 队列</button>
    </fieldset>

    <fieldset>
      <legend>外验 external</legend>
      <div id="external-rows"></div>
      <button type="button" id="add-external">+ 外验</button>
    </fieldset>

    <fieldset>
      <legend>方法行 pipeline</legend>
      <label class="fld">重采样 balance
        <select id="balance">
          <option value="">无</option>
          <option value="downsample">downsample</option>
          <option value="smote">SMOTE</option>
        </select>
      </label>
      <label class="fld">balance_n <input id="balance-n" class="num" type="number" min="0"/></label>
      <div id="step-rows"></div>
      <button type="button" id="add-step">+ 方法行</button>
    </fieldset>

    <fieldset>
      <legend>分析人数 analyzed</legend>
      <label class="fld">label（优先显示；留空按 n= / PP n= 拼）<input id="analyzed-label" type="text"/></label>
      <div class="row">
        <input id="analyzed-n" class="num" type="number" min="0" placeholder="n"/>
        <input id="analyzed-pp" type="number" min="0" placeholder="PP n"/>
        <input id="analyzed-nonpp" type="number" min="0" placeholder="non-PP n"/>
      </div>
    </fieldset>

    <label class="fld">阳性名称 pos_name <input id="pos-name" type="text"/></label>
    <label class="fld">备注 notes <textarea id="notes" rows="2"></textarea></label>
    <p id="msg" aria-live="polite"></p>
  </aside>

  <section class="preview-col">
    <div id="canvas"><div id="canvas-inner"><img id="preview-img" alt="Figure 1 预览"/><div id="handles"></div></div></div>
    <p id="empty" class="empty">正在读取 Figure 1 …</p>
    <p id="warnings" class="warn"></p>
  </section>
</main>

<script>
(function () {
  "use strict";
  const SPEC_REL = "ref/pipeline/figure1_strobe.json";
  const STEP_KINDS = [
    ["lasso_logistic", "LASSO logistic"], ["nomogram", "Nomogram"],
    ["calibration", "Calibration"], ["roc", "ROC AUC"],
    ["nri_idi", "NRI / IDI"], ["dca", "DCA"],
    ["models", "Models"], ["explain", "DAG / Mediation"],
  ];
  const DEFAULT_STEPS = ["lasso_logistic", "nomogram", "calibration", "roc", "nri_idi", "dca"];
  const MODEL_ITEMS = ["clinical", "radiomics", "nomogram"];
  const EXPLAIN_ITEMS = ["dag", "mediation"];
  const ZOOM_MIN = 0.25;
  const ZOOM_MAX = 4;
  const ZOOM_STEP = 1.12;
  const EDIT_DEBOUNCE_MS = 600;
  const MAX_UNDO = 50;

  const $ = (id) => document.getElementById(id);
  const state = {
    project: "",
    spec: null,
    overrides: { boxes: {}, edges: {}, hidden: [] },
    geometry: null,
    draft: null,
    tune: false,
    zoom: 1,
    fitW: 0,
    previewBusy: false,
    previewSeq: 0,
    history: [],
  };

  function clone(value) { return JSON.parse(JSON.stringify(value)); }
  function token() {
    let value = "";
    const meta = document.querySelector('meta[name="console-token"]');
    if (meta) value = String(meta.getAttribute("content") || "").trim();
    if (!value || value === "__CONSOLE_TOKEN__") {
      try {
        const parent = window.parent && window.parent.document;
        const pm = parent ? parent.querySelector('meta[name="console-token"]') : null;
        if (pm) value = String(pm.getAttribute("content") || "").trim();
      } catch (err) { value = ""; }
    }
    return value === "__CONSOLE_TOKEN__" ? "" : value;
  }
  async function api(path, options) {
    const opts = Object.assign({ cache: "no-store" }, options || {});
    const headers = Object.assign({}, opts.headers || {});
    const tok = token();
    if (tok) headers["X-Console-Token"] = tok;
    if (opts.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
    const response = await fetch(path, Object.assign({}, opts, { headers }));
    let data = null;
    try { data = await response.json(); } catch (err) { data = null; }
    if (data === null) throw new Error("HTTP " + response.status);
    return data;
  }

  function setStatus(text) { $("status").textContent = text || ""; }
  function setMsg(text, bad) {
    const el = $("msg");
    el.textContent = text || "";
    el.className = bad ? "err" : "";
  }
  function setWarnings(list) {
    $("warnings").textContent = (list && list.length) ? "⚠ " + list.join("；") : "";
  }
  function showPage(pageCm) {
    $("page-info").textContent = pageCm && pageCm.length
      ? "页宽 " + pageCm[0].toFixed(1) + " × " + pageCm[1].toFixed(1) + " cm"
      : "";
  }
  function setDraftBadge(draft) {
    const el = $("draft-badge");
    if (!draft) { el.hidden = true; el.textContent = ""; return; }
    const ok = draft.generated && !draft.stale;
    el.textContent = "草稿（" + (ok ? "已生成" : "未生成") + "）";
    el.title = draft.saved_at ? "保存于 " + draft.saved_at : "";
    el.hidden = false;
  }
  function numOrNull(value) {
    const text = String(value == null ? "" : value).trim();
    if (!text) return null;
    const n = Number(text);
    return Number.isFinite(n) ? Math.trunc(n) : null;
  }
  function textValue(value) { return value == null ? "" : String(value); }
  function esc(value) {
    return textValue(value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function blankPipeline() {
    return { balance: null, balance_n: null, steps: DEFAULT_STEPS.map((kind) => ({ kind: kind, enabled: false })) };
  }
  function blankSpec() {
    return {
      schema_version: 3,
      layout: "expanded-split-downsample",
      screened: { text: "", n: null },
      criteria: { inclusion: [], exclusion: [] },
      included: { text: "", n: null, pp: null, non_pp: null },
      presplit: [],
      downsample: [],
      cohorts: [],
      external: [],
      analyzed: { text: "", label: "", n: null, pp: null, non_pp: null },
      pos_name: "positive",
      notes: "",
      overrides: { boxes: {}, edges: {}, hidden: [] },
      font_size: 12,
      pipeline: blankPipeline(),
    };
  }

  function exclusionText(item) {
    const reason = textValue(item && item.reason ? item.reason : "").trim();
    const n = item && item.n != null ? item.n : null;
    if (n == null) return reason;
    return reason ? reason + " (n=" + n + ")" : "(n=" + n + ")";
  }
  function parseExclusion(text) {
    return textValue(text).split(/\r?\n/).map((line) => line.trim()).filter(Boolean).map((line) => {
      const matched = line.match(/^(.*?)(?:\s*\(n\s*=\s*(\d+)\))?$/);
      return {
        reason: (matched && matched[1] != null ? matched[1] : line).trim(),
        n: matched && matched[2] ? Number(matched[2]) : null,
      };
    });
  }

  /* ---- row builders ---- */
  function addPresplitRow(item) {
    const row = document.createElement("div");
    row.className = "row"; row.dataset.kind = "presplit";
    row.innerHTML =
      '<input class="f-label" placeholder="臂标签" value="' + esc(item.label) + '"/>' +
      '<input class="num f-n" type="number" min="0" placeholder="n=" value="' + esc(item.n) + '"/>' +
      '<input class="num f-pp" type="number" min="0" placeholder="PP n=" value="' + esc(item.pp) + '"/>' +
      '<input class="num f-nonpp" type="number" min="0" placeholder="non-PP n=" value="' + esc(item.non_pp) + '"/>' +
      '<button type="button" title="删除该臂">×</button>';
    row.querySelector("button").addEventListener("click", () => { row.remove(); onRowsChanged(); });
    $("presplit-rows").appendChild(row);
  }
  function addDownsampleRow(item) {
    const row = document.createElement("div");
    row.className = "row"; row.dataset.kind = "downsample";
    row.innerHTML =
      '<select class="f-arm"></select>' +
      '<input class="num f-n" type="number" min="0" placeholder="n=" value="' + esc(item.n) + '"/>' +
      '<select class="f-class"><option value="non_pp">non-PP</option><option value="pp">PP</option></select>' +
      '<input class="f-reason" placeholder="原因" value="' + esc(item.reason) + '"/>' +
      '<button type="button" title="删除该降采样">×</button>';
    row.querySelector(".f-class").value = item["class"] === "pp" ? "pp" : "non_pp";
    row.querySelector("button").addEventListener("click", () => { row.remove(); onRowsChanged(); });
    $("downsample-rows").appendChild(row);
    refreshArms();
  }
  function addCohortRow(item) {
    const row = document.createElement("div");
    row.className = "row"; row.dataset.kind = "cohort";
    row.innerHTML =
      '<input class="f-label" placeholder="队列标签" value="' + esc(item.label) + '"/>' +
      '<input class="num f-n" type="number" min="0" placeholder="n=" value="' + esc(item.n) + '"/>' +
      '<input class="num f-pp" type="number" min="0" placeholder="PP n=" value="' + esc(item.pp) + '"/>' +
      '<input class="num f-nonpp" type="number" min="0" placeholder="non-PP n=" value="' + esc(item.non_pp) + '"/>' +
      '<button type="button" title="删除该队列">×</button>';
    row.querySelector("button").addEventListener("click", () => { row.remove(); onRowsChanged(); });
    $("cohort-rows").appendChild(row);
  }
  function addExternalRow(item) {
    const row = document.createElement("div");
    row.className = "row"; row.dataset.kind = "external";
    row.innerHTML =
      '<input class="f-label" placeholder="外验标签" value="' + esc(item.label) + '"/>' +
      '<input class="num f-n" type="number" min="0" placeholder="n=" value="' + esc(item.n) + '"/>' +
      '<input class="num f-pp" type="number" min="0" placeholder="PP n=" value="' + esc(item.pp) + '"/>' +
      '<input class="num f-nonpp" type="number" min="0" placeholder="non-PP n=" value="' + esc(item.non_pp) + '"/>' +
      '<button type="button" title="删除该外验">×</button>';
    row.querySelector("button").addEventListener("click", () => { row.remove(); onRowsChanged(); });
    $("external-rows").appendChild(row);
  }
  function addStepRow(step) {
    const row = document.createElement("div");
    row.className = "row"; row.dataset.kind = "step";
    const options = STEP_KINDS.map(([kind, label]) =>
      '<option value="' + kind + '">' + esc(label) + '</option>').join("");
    row.innerHTML =
      '<label><input class="f-enabled" type="checkbox"' + (step.enabled ? " checked" : "") + '/></label>' +
      '<select class="f-kind">' + options + '</select>' +
      '<input class="f-label" placeholder="label（可选）" value="' + esc(step.label) + '"/>' +
      '<input class="f-items" placeholder="items（逗号分隔）" value="' + esc((step.items || []).join(",")) + '"/>' +
      '<button type="button" class="f-up" title="上移">↑</button>' +
      '<button type="button" class="f-down" title="下移">↓</button>' +
      '<button type="button" class="f-remove" title="删除该行">×</button>';
    row.querySelector(".f-kind").value = step.kind;
    row.querySelector(".f-up").addEventListener("click", () => { moveStep(row, -1); });
    row.querySelector(".f-down").addEventListener("click", () => { moveStep(row, 1); });
    row.querySelector(".f-remove").addEventListener("click", () => { row.remove(); onRowsChanged(); });
    row.querySelector(".f-kind").addEventListener("change", onRowsChanged);
    $("step-rows").appendChild(row);
  }
  function moveStep(row, delta) {
    const container = $("step-rows");
    const rows = Array.from(container.querySelectorAll('[data-kind="step"]'));
    const index = rows.indexOf(row);
    const target = index + delta;
    if (target < 0 || target >= rows.length) return;
    if (delta < 0) container.insertBefore(row, rows[target]);
    else container.insertBefore(rows[target], row);
    onRowsChanged();
  }
  function refreshArms() {
    const arms = Array.from($("presplit-rows").querySelectorAll('[data-kind="presplit"]')).map((row, index) => ({
      id: "arm-" + index,
      label: row.querySelector(".f-label").value.trim() || ("Arm " + (index + 1)),
    }));
    Array.from($("downsample-rows").querySelectorAll('[data-kind="downsample"]')).forEach((row) => {
      const select = row.querySelector(".f-arm");
      const chosen = select.value || (arms[0] && arms[0].id) || "";
      select.innerHTML = "";
      arms.forEach((arm) => {
        const option = document.createElement("option");
        option.value = arm.id;
        option.textContent = arm.label;
        select.appendChild(option);
      });
      if (arms.some((arm) => arm.id === chosen)) select.value = chosen;
    });
  }

  function renderRows(container, rows, adder) {
    container.innerHTML = "";
    (rows || []).forEach(adder);
  }

  /* ---- form <-> spec ---- */
  function renderForm(spec) {
    spec = spec || blankSpec();
    $("screened-text").value = textValue(spec.screened && spec.screened.text);
    $("screened-n").value = spec.screened && spec.screened.n != null ? spec.screened.n : "";
    $("inclusion").value = ((spec.criteria && spec.criteria.inclusion) || []).join("\n");
    $("exclusion").value = ((spec.criteria && spec.criteria.exclusion) || []).map(exclusionText).join("\n");
    const included = spec.included || {};
    $("included-text").value = textValue(included.text);
    $("included-n").value = included.n != null ? included.n : "";
    $("included-pp").value = included.pp != null ? included.pp : "";
    $("included-nonpp").value = included.non_pp != null ? included.non_pp : "";
    renderRows($("presplit-rows"), spec.presplit, addPresplitRow);
    renderRows($("downsample-rows"), spec.downsample, addDownsampleRow);
    renderRows($("cohort-rows"), spec.cohorts, addCohortRow);
    renderRows($("external-rows"), spec.external, addExternalRow);
    const pipeline = spec.pipeline || blankPipeline();
    $("balance").value = pipeline.balance || "";
    $("balance-n").value = pipeline.balance_n != null ? pipeline.balance_n : "";
    renderRows($("step-rows"), pipeline.steps, addStepRow);
    const analyzed = spec.analyzed || {};
    $("analyzed-label").value = textValue(analyzed.label);
    $("analyzed-n").value = analyzed.n != null ? analyzed.n : "";
    $("analyzed-pp").value = analyzed.pp != null ? analyzed.pp : "";
    $("analyzed-nonpp").value = analyzed.non_pp != null ? analyzed.non_pp : "";
    $("pos-name").value = spec.pos_name || "";
    $("notes").value = spec.notes || "";
    refreshArms();
  }

  function collectSpec() {
    const spec = state.spec ? clone(state.spec) : blankSpec();
    spec.schema_version = 3;
    spec.screened = { text: $("screened-text").value, n: numOrNull($("screened-n").value) };
    spec.criteria = {
      inclusion: $("inclusion").value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean),
      exclusion: parseExclusion($("exclusion").value),
    };
    spec.included = {
      text: $("included-text").value,
      n: numOrNull($("included-n").value),
      pp: numOrNull($("included-pp").value),
      non_pp: numOrNull($("included-nonpp").value),
    };
    spec.presplit = Array.from($("presplit-rows").querySelectorAll('[data-kind="presplit"]')).map((row, index) => ({
      id: "arm-" + index,
      label: row.querySelector(".f-label").value.trim() || ("Arm " + (index + 1)),
      n: numOrNull(row.querySelector(".f-n").value),
      pp: numOrNull(row.querySelector(".f-pp").value),
      non_pp: numOrNull(row.querySelector(".f-nonpp").value),
    }));
    spec.downsample = Array.from($("downsample-rows").querySelectorAll('[data-kind="downsample"]')).map((row) => ({
      arm: row.querySelector(".f-arm").value || "arm-0",
      n: numOrNull(row.querySelector(".f-n").value),
      "class": row.querySelector(".f-class").value,
      reason: row.querySelector(".f-reason").value.trim(),
    }));
    spec.cohorts = Array.from($("cohort-rows").querySelectorAll('[data-kind="cohort"]')).map((row, index) => ({
      id: "cohort-" + index,
      label: row.querySelector(".f-label").value.trim() || ("Cohort " + (index + 1)),
      n: numOrNull(row.querySelector(".f-n").value),
      pp: numOrNull(row.querySelector(".f-pp").value),
      non_pp: numOrNull(row.querySelector(".f-nonpp").value),
    }));
    spec.external = Array.from($("external-rows").querySelectorAll('[data-kind="external"]')).map((row, index) => ({
      id: "external-" + index,
      label: row.querySelector(".f-label").value.trim() || ("External " + (index + 1)),
      n: numOrNull(row.querySelector(".f-n").value),
      pp: numOrNull(row.querySelector(".f-pp").value),
      non_pp: numOrNull(row.querySelector(".f-nonpp").value),
    }));
    spec.pipeline = {
      balance: $("balance").value || null,
      balance_n: numOrNull($("balance-n").value),
      steps: Array.from($("step-rows").querySelectorAll('[data-kind="step"]')).map((row) => {
        const items = row.querySelector(".f-items").value.split(",").map((s) => s.trim()).filter(Boolean);
        const step = {
          kind: row.querySelector(".f-kind").value,
          enabled: row.querySelector(".f-enabled").checked,
        };
        const label = row.querySelector(".f-label").value.trim();
        if (label) step.label = label;
        if (items.length) step.items = items;
        return step;
      }),
    };
    const analyzed = spec.analyzed || {};
    spec.analyzed = {
      text: textValue(analyzed.text),
      label: $("analyzed-label").value.trim(),
      n: numOrNull($("analyzed-n").value),
      pp: numOrNull($("analyzed-pp").value),
      non_pp: numOrNull($("analyzed-nonpp").value),
    };
    spec.pos_name = $("pos-name").value.trim();
    spec.notes = $("notes").value;
    spec.overrides = state.overrides;
    const pipe = spec.pipeline || {};
    const hasBalance = !!pipe.balance;
    const hasStep = (pipe.steps || []).some((step) => step.enabled);
    if (spec.layout !== "study" && !hasBalance && !hasStep) delete spec.pipeline;
    return spec;
  }

  /* ---- history ---- */
  function snapshotState() {
    return { spec: collectSpec(), overrides: clone(state.overrides) };
  }
  function resetHistory() {
    const snap = snapshotState();
    state.history = [{ key: JSON.stringify(snap), state: snap }];
  }
  function commitHistory() {
    const snap = snapshotState();
    const key = JSON.stringify(snap);
    const last = state.history[state.history.length - 1];
    if (last && last.key === key) return;
    state.history.push({ key: key, state: snap });
    if (state.history.length > MAX_UNDO) state.history.shift();
  }
  function applySnapshot(snap) {
    state.spec = clone(snap.spec);
    state.overrides = clone(snap.overrides);
    renderForm(state.spec);
    schedulePreview(0);
    renderHandles();
  }
  function undo() {
    if (state.history.length <= 1) { setMsg("没有可撤销的操作。"); return; }
    state.history.pop();
    applySnapshot(state.history[state.history.length - 1].state);
    setMsg("已撤销。");
  }

  /* ---- preview / zoom ---- */
  function showEmpty(text) {
    $("empty").textContent = text;
    $("empty").classList.remove("hidden");
    $("preview-img").classList.add("hidden");
    $("handles").innerHTML = "";
  }
  function showImage() {
    $("empty").classList.add("hidden");
    $("preview-img").classList.remove("hidden");
    renderHandles();
  }
  function computeFitWidth() {
    const img = $("preview-img");
    const canvas = $("canvas");
    if (!img.naturalWidth || !img.naturalHeight) return 0;
    const cw = Math.max(0, canvas.clientWidth - 20);
    const ch = Math.max(0, canvas.clientHeight - 20);
    const ratio = img.naturalWidth / img.naturalHeight;
    return Math.max(0, Math.min(cw, ch * ratio));
  }
  function zoomLabel() {
    $("zoom-label").textContent = Math.round(state.zoom * 100) + "%";
  }
  function applyZoom(nextZoom, anchorEvent) {
    const img = $("preview-img");
    if (img.classList.contains("hidden")) return;
    const canvas = $("canvas");
    const oldRect = img.getBoundingClientRect();
    const oldZoom = state.zoom;
    if (oldZoom === 1 && state.fitW <= 0) state.fitW = oldRect.width;
    const zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, nextZoom));
    if (Math.abs(zoom - oldZoom) < 1e-9) return;
    state.zoom = zoom;
    if (zoom === 1) {
      img.style.maxWidth = "";
      img.style.maxHeight = "";
      img.style.width = "";
      img.style.height = "";
    } else {
      if (!state.fitW) state.fitW = oldRect.width / oldZoom;
      img.style.maxWidth = "none";
      img.style.maxHeight = "none";
      img.style.width = (state.fitW * zoom) + "px";
      img.style.height = "auto";
    }
    zoomLabel();
    const anchor = anchorEvent ? { x: anchorEvent.clientX, y: anchorEvent.clientY } : null;
    requestAnimationFrame(() => {
      if (anchor) {
        const newRect = img.getBoundingClientRect();
        const rx = Math.min(1, Math.max(0, (anchor.x - oldRect.left) / (oldRect.width || 1)));
        const ry = Math.min(1, Math.max(0, (anchor.y - oldRect.top) / (oldRect.height || 1)));
        const dx = (newRect.left + rx * newRect.width) - (oldRect.left + rx * oldRect.width);
        const dy = (newRect.top + ry * newRect.height) - (oldRect.top + ry * oldRect.height);
        canvas.scrollLeft += dx;
        canvas.scrollTop += dy;
      }
      renderHandles();
    });
  }
  function fitWindow() {
    state.fitW = computeFitWidth();
    applyZoom(1, null);
  }

  function renderHandles() {
    const wrap = $("handles");
    wrap.innerHTML = "";
    const img = $("preview-img");
    if (!state.geometry || img.classList.contains("hidden")) return;
    const pageW = state.geometry.page_in[0];
    if (!pageW || !img.clientWidth) return;
    wrap.style.left = img.offsetLeft + "px";
    wrap.style.top = img.offsetTop + "px";
    wrap.style.width = img.clientWidth + "px";
    wrap.style.height = img.clientHeight + "px";
    const scale = img.clientWidth / pageW;
    (state.geometry.boxes || []).forEach((box) => {
      const el = document.createElement("div");
      el.className = "handle";
      el.dataset.id = box.id;
      el.style.left = box.x * scale + "px";
      el.style.top = box.y * scale + "px";
      el.style.width = box.w * scale + "px";
      el.style.height = box.h * scale + "px";
      el.addEventListener("pointerdown", startDrag);
      wrap.appendChild(el);
    });
  }

  function startDrag(ev) {
    if (!state.tune || !state.geometry) return;
    ev.preventDefault();
    const id = ev.currentTarget.dataset.id;
    const box = (state.geometry.boxes || []).find((item) => item.id === id);
    if (!box) return;
    const img = $("preview-img");
    const scale = img.clientWidth / state.geometry.page_in[0];
    if (!scale) return;
    const startX = ev.clientX;
    const startY = ev.clientY;
    const originX = box.x;
    const originY = box.y;
    const el = ev.currentTarget;
    const move = (event) => {
      const dx = (event.clientX - startX) / scale;
      const dy = (event.clientY - startY) / scale;
      el._x = originX + dx;
      el._y = originY + dy;
      el.style.left = el._x * scale + "px";
      el.style.top = el._y * scale + "px";
    };
    const up = () => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      state.overrides.boxes[id] = {
        x: Math.round((el._x == null ? originX : el._x) * 1000) / 1000,
        y: Math.round((el._y == null ? originY : el._y) * 1000) / 1000,
      };
      onRowsChanged();
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  }

  let previewTimer = null;
  function schedulePreview(delay) {
    if (!state.project) return;
    clearTimeout(previewTimer);
    previewTimer = setTimeout(runPreview, delay == null ? 550 : delay);
  }
  async function runPreview() {
    if (!state.project) return;
    if (state.previewBusy) { schedulePreview(); return; }
    state.previewBusy = true;
    const seq = ++state.previewSeq;
    try {
      const spec = collectSpec();
      const data = await api("/api/flow_preview", {
        method: "POST",
        body: JSON.stringify({ project: state.project, spec: spec, overrides: state.overrides }),
      });
      if (seq !== state.previewSeq) return;
      if (!data.ok) { setMsg("预览失败：" + (data.error || "未知错误"), true); return; }
      state.geometry = data.geometry;
      const img = $("preview-img");
      img.src = "data:image/png;base64," + data.png_base64;
      showImage();
      showPage(data.page_cm);
      setWarnings(data.warnings);
      setMsg("预览已更新（未保存）");
    } catch (err) {
      setMsg("预览失败：" + (err && err.message ? err.message : err), true);
    } finally {
      state.previewBusy = false;
    }
  }
  function onRowsChanged() {
    commitHistory();
    schedulePreview(0);
  }
  let editTimer = null;
  function onEdit() {
    clearTimeout(editTimer);
    editTimer = setTimeout(() => {
      commitHistory();
      schedulePreview(0);
    }, EDIT_DEBOUNCE_MS);
  }

  /* ---- draft / load / save ---- */
  async function refreshDraft() {
    try {
      const data = await api("/flow_figure?project=" + encodeURIComponent(state.project));
      if (data && data.ok) {
        state.draft = data.draft || null;
        setDraftBadge(state.draft);
      }
    } catch (err) { /* 草稿状态刷新失败不打断编辑 */ }
  }
  async function saveDesign() {
    if (!state.project) return;
    try {
      const spec = collectSpec();
      const data = await api("/api/flow_save_design", {
        method: "POST",
        body: JSON.stringify({ project: state.project, spec: spec }),
      });
      if (!data.ok) { setMsg("保存设计失败：" + (data.error || "未知错误"), true); return; }
      setMsg("设计草稿已保存（" + (data.saved_at || "") + "）；未生成正式图。");
      await refreshDraft();
    } catch (err) {
      setMsg("保存设计失败：" + (err && err.message ? err.message : err), true);
    }
  }
  async function discardDraft() {
    if (!state.project) return;
    try {
      const data = await api("/api/flow_discard_design", {
        method: "POST",
        body: JSON.stringify({ project: state.project }),
      });
      if (!data.ok) { setMsg("放弃草稿失败：" + (data.error || "未知错误"), true); return; }
      setMsg(data.discarded ? "已放弃草稿，回到正式 spec。" : "没有草稿。");
      await load();
    } catch (err) {
      setMsg("放弃草稿失败：" + (err && err.message ? err.message : err), true);
    }
  }
  async function loadManuscripts() {
    if (!state.project) return;
    try {
      const data = await api("/flow_files?project=" + encodeURIComponent(state.project));
      const select = $("manuscript");
      select.innerHTML = "";
      ((data && data.files) || []).forEach((file) => {
        const option = document.createElement("option");
        option.value = file.name;
        option.textContent = file.name;
        select.appendChild(option);
      });
      if (data && data.default) select.value = data.default;
    } catch (err) {
      setStatus("读取手稿列表失败：" + (err && err.message ? err.message : err));
    }
  }
  async function load() {
    if (!state.project) { setStatus("缺少 project 参数"); return; }
    setStatus("读取 " + SPEC_REL + " …");
    const data = await api("/flow_figure?project=" + encodeURIComponent(state.project));
    if (!data || !data.ok) {
      state.spec = blankSpec();
      state.overrides = { boxes: {}, edges: {}, hidden: [] };
      state.geometry = null;
      state.draft = null;
      renderForm(state.spec);
      showEmpty("未生成 → 按手稿重做");
      setDraftBadge(null);
      setStatus("尚未生成：" + ((data && data.error) || "Figure 1 spec 不存在"));
      setMsg("");
      resetHistory();
      await loadManuscripts();
      return;
    }
    state.draft = data.draft || null;
    let spec = data.spec || blankSpec();
    if (state.draft && state.draft.spec) spec = state.draft.spec;
    state.spec = spec;
    state.overrides = (spec.overrides || (state.draft && state.draft.spec && state.draft.spec.overrides) || { boxes: {}, edges: {}, hidden: [] });
    state.geometry = data.geometry || null;
    renderForm(state.spec);
    setDraftBadge(state.draft);
    showPage(data.page_cm);
    setWarnings(data.warnings);
    $("preview-img").style.width = "";
    $("preview-img").style.height = "";
    $("preview-img").style.maxWidth = "";
    $("preview-img").style.maxHeight = "";
    state.zoom = 1;
    state.fitW = 0;
    zoomLabel();
    const draftStale = state.draft && (state.draft.stale || !state.draft.generated);
    if (!draftStale && data.png_exists && data.png_rel) {
      $("preview-img").src = "/files/" + encodeURIComponent(state.project) + "/" +
        String(data.png_rel).split("/").map(encodeURIComponent).join("/") + "?t=" + Date.now();
      showImage();
    } else if (state.draft) {
      setMsg("草稿未生成正式图，正在预览草稿…");
      schedulePreview(0);
    } else {
      showEmpty("PNG 未生成：保存后出现");
    }
    setStatus("源文件：" + (data.spec_rel || SPEC_REL));
    resetHistory();
    await loadManuscripts();
  }
  async function save() {
    if (!state.project) return;
    clearTimeout(previewTimer);
    const spec = collectSpec();
    spec.overrides = state.overrides;
    setMsg("正在保存并生成 Figure 1 …（审计/渲染失败不写文件）");
    try {
      const data = await api("/api/flow_figure", {
        method: "POST",
        body: JSON.stringify({ project: state.project, spec: spec }),
      });
      if (!data.ok) { setMsg("保存失败：" + (data.error || "未知错误"), true); return; }
      const parts = ["已保存：" + (data.spec_rel || SPEC_REL)];
      if (data.png_rel) parts.push("PNG：" + data.png_rel);
      parts.push((data.results || []).length ? "结果夹 " + data.results.length + " 个" : "未找到结果夹");
      parts.push((data.patched || []).length ? "Results 已回填" : "Results 未改动");
      setMsg(parts.join("；"));
      try { await api("/api/flow_save_design", { method: "POST", body: JSON.stringify({ project: state.project, spec: spec }) }); } catch (err) { /* 草稿同步失败不影响已保存 */ }
      await load();
    } catch (err) {
      setMsg("保存失败：" + (err && err.message ? err.message : err), true);
    }
  }
  async function fillFromManuscript() {
    const file = $("manuscript").value;
    if (!state.project || !file) { setMsg("先选择子工程手稿。", true); return; }
    setMsg("读取 " + file + " …");
    try {
      const data = await api("/flow_spec?project=" + encodeURIComponent(state.project) +
        "&file=" + encodeURIComponent(file));
      if (!data.ok) { setMsg((data && data.error) || "手稿解析失败", true); return; }
      const canonical = data.canonical && data.canonical.spec;
      if (!canonical) { setMsg("手稿解析没有返回 canonical spec。", true); return; }
      const oldSpec = state.spec ? clone(state.spec) : null;
      state.spec = canonical;
      state.overrides = canonical.overrides || { boxes: {}, edges: {}, hidden: [] };
      renderForm(state.spec);
      highlightChanged(oldSpec, canonical);
      const missing = (data.missing || []).length ? "（缺：" + data.missing.join("、") + "）" : "";
      setStatus("已按 " + file + " 填写");
      setMsg("已按 " + file + " 填写，请核对后保存" + missing + ((data.canonical && data.canonical.problems || []).length ? "；" + data.canonical.problems.join("；") : ""));
      resetHistory();
      schedulePreview(0);
    } catch (err) {
      setMsg("手稿填写失败：" + (err && err.message ? err.message : err), true);
    }
  }
  function highlightChanged(oldSpec, newSpec) {
    const pairs = [
      ["screened-text", oldSpec && oldSpec.screened && oldSpec.screened.text, newSpec.screened && newSpec.screened.text],
      ["screened-n", oldSpec && oldSpec.screened && oldSpec.screened.n, newSpec.screened && newSpec.screened.n],
      ["pos-name", oldSpec && oldSpec.pos_name, newSpec.pos_name],
      ["notes", oldSpec && oldSpec.notes, newSpec.notes],
    ];
    pairs.forEach(([id, before, after]) => {
      if (String(before == null ? "" : before) !== String(after == null ? "" : after)) $(id).classList.add("changed");
    });
    const oldInclusion = ((oldSpec && oldSpec.criteria && oldSpec.criteria.inclusion) || []).join("\n");
    if (oldInclusion !== $("inclusion").value) $("inclusion").classList.add("changed");
    const oldExclusion = ((oldSpec && oldSpec.criteria && oldSpec.criteria.exclusion) || []).map(exclusionText).join("\n");
    if (oldExclusion !== $("exclusion").value) $("exclusion").classList.add("changed");
    const rowKey = (value) => JSON.stringify({
      presplit: value && value.presplit, downsample: value && value.downsample,
      cohorts: value && value.cohorts, external: value && value.external,
    });
    if (rowKey(oldSpec) !== rowKey(newSpec)) {
      ["presplit-rows", "downsample-rows", "cohort-rows", "external-rows"].forEach((id) => $(id).classList.add("changed"));
    }
  }

  function bind() {
    const formIds = [
      "screened-text", "screened-n", "inclusion", "exclusion",
      "included-text", "included-n", "included-pp", "included-nonpp",
      "analyzed-label", "analyzed-n", "analyzed-pp", "analyzed-nonpp",
      "pos-name", "notes", "balance", "balance-n",
    ];
    formIds.forEach((id) => {
      $(id).addEventListener("input", onEdit);
      $(id).addEventListener("change", onEdit);
    });
    $("presplit-rows").addEventListener("input", () => { refreshArms(); onEdit(); });
    $("downsample-rows").addEventListener("change", onEdit);
    $("cohort-rows").addEventListener("input", onEdit);
    $("external-rows").addEventListener("input", onEdit);
    $("step-rows").addEventListener("input", onEdit);
    $("step-rows").addEventListener("change", onEdit);
    $("add-presplit").addEventListener("click", () => { addPresplitRow({ label: "", n: null, pp: null, non_pp: null }); refreshArms(); onRowsChanged(); });
    $("add-downsample").addEventListener("click", () => {
      addDownsampleRow({ arm: "", n: null, "class": "non_pp", reason: "" });
      onRowsChanged();
    });
    $("add-cohort").addEventListener("click", () => { addCohortRow({ label: "", n: null, pp: null, non_pp: null }); onRowsChanged(); });
    $("add-external").addEventListener("click", () => { addExternalRow({ label: "", n: null, pp: null, non_pp: null }); onRowsChanged(); });
    $("add-step").addEventListener("click", () => { addStepRow({ kind: "lasso_logistic", enabled: true }); onRowsChanged(); });
    $("btn-undo").addEventListener("click", undo);
    document.addEventListener("keydown", (event) => {
      if (!(event.ctrlKey || event.metaKey) || (event.key !== "z" && event.key !== "Z")) return;
      const tag = (document.activeElement && document.activeElement.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      event.preventDefault();
      undo();
    });
    $("btn-save-design").addEventListener("click", saveDesign);
    $("btn-save").addEventListener("click", save);
    $("btn-discard").addEventListener("click", discardDraft);
    $("btn-reload").addEventListener("click", () => { load().catch((err) => setStatus(String(err))); });
    $("btn-fill").addEventListener("click", fillFromManuscript);
    $("btn-tune").addEventListener("click", () => {
      state.tune = !state.tune;
      $("btn-tune").textContent = state.tune ? "退出微调" : "微调版式";
      $("canvas").classList.toggle("tune", state.tune);
      setMsg(state.tune ? "微调版式：拖动预览框，松手后重渲染。" : "已退出微调。");
    });
    $("btn-reset").addEventListener("click", () => {
      state.overrides = { boxes: {}, edges: {}, hidden: [] };
      setMsg("已恢复默认版式（保存后才落盘）。");
      onRowsChanged();
    });
    $("btn-zoom-out").addEventListener("click", () => applyZoom(state.zoom / ZOOM_STEP, null));
    $("btn-zoom-in").addEventListener("click", () => applyZoom(state.zoom * ZOOM_STEP, null));
    $("btn-fit").addEventListener("click", () => fitWindow());
    $("canvas").addEventListener("wheel", (event) => {
      event.preventDefault();
      const factor = event.deltaY < 0 ? ZOOM_STEP : 1 / ZOOM_STEP;
      applyZoom(state.zoom * factor, event);
    }, { passive: false });
    $("preview-img").addEventListener("load", () => {
      state.fitW = computeFitWidth();
      if (state.zoom === 1) { zoomLabel(); renderHandles(); }
      else applyZoom(state.zoom, null);
    });
    window.addEventListener("resize", () => {
      state.fitW = computeFitWidth();
      if (state.zoom !== 1) applyZoom(state.zoom, null);
      else renderHandles();
    });
    document.addEventListener("input", (event) => {
      if (event.target && event.target.classList) event.target.classList.remove("changed");
    });
  }

  state.project = new URLSearchParams(location.search).get("project") || "";
  bind();
  load().catch((err) => { setStatus("读取失败：" + String(err)); setMsg(String(err), true); });
})();
</script>
</body>
</html>
