<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="console-token" content="__CONSOLE_TOKEN__"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SCI Figure 1 · 研究流程图</title>
<style>
:root{--bg:#f4f1ea;--paper:#fffcf6;--ink:#1c2421;--muted:#5c6b66;--line:#d7d0c4;--accent:#0f4c5c;--warn:#9a6b12;--err:#9b2c2c;--ok:#2f6f4e;--chip:#e8efe9;--changed:#fff3cd}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--accent);color:#f4f1ea;padding:12px 18px}
header h1{margin:0;font-size:18px;font-weight:650}
header p{margin:2px 0 0;font-size:12px;opacity:.82}
header .grow{flex:1 1 auto}
header select,header button{font:inherit}
header select{max-width:260px}
main{display:grid;grid-template-columns:minmax(420px,520px) minmax(0,1fr);gap:0;height:calc(100% - 64px)}
aside{padding:14px 16px 40px;overflow:auto;border-right:1px solid var(--line);background:var(--paper)}
section.preview{padding:14px 16px 40px;overflow:auto}
fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 12px;padding:10px 12px;background:#fff}
legend{font-size:12px;color:var(--muted);font-weight:600;padding:0 4px}
label.fld{display:block;margin:0 0 8px;font-size:12px;color:var(--muted)}
label.fld input,label.fld textarea,label.fld select{width:100%;margin-top:3px;font:inherit;color:var(--ink);background:#fbfaf7;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
label.fld textarea{min-height:56px;resize:vertical}
input[type=number]{width:110px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:0 0 6px}
.row input{min-width:0;flex:1 1 70px}
.row input.num{flex:0 0 84px}
.row select{flex:1 1 100px}
.row button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:6px;padding:2px 8px;cursor:pointer}
button{font:inherit;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:6px;padding:6px 10px;cursor:pointer}
button.primary{background:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
.changed{background:var(--changed) !important}
#notice{margin:0 0 12px;padding:8px 10px;border-radius:8px;background:#fff6e8;color:#8a4a12;box-shadow:inset 0 0 0 1px #ead9b8}
#msg{min-height:18px;font-size:12px;color:var(--muted);margin:8px 0 0}
#msg.err{color:var(--err)}
.preview-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 8px}
.preview-bar h2{margin:0;font-size:14px;font-weight:650}
#page-info{font-size:12px;color:var(--muted)}
#tune.active{border-color:var(--ok);background:var(--chip);color:var(--ok)}
.stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:200px}
.stage img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
#handles{position:absolute;inset:10px;pointer-events:none}
.handle{position:absolute;border:1px dashed transparent;pointer-events:none;border-radius:3px}
.stage.tune .handle{pointer-events:auto;cursor:move;border-color:rgba(15,76,92,.35)}
.stage.tune .handle:hover{border-color:var(--accent);background:rgba(15,76,92,.05)}
.empty{color:var(--muted);font-size:13px;margin:12px 0 0}
.warn{color:var(--warn);font-size:12px;margin:8px 0 0}
.hidden{display:none !important}
</style>
</head>
<body>
<header>
  <div class="grow">
    <h1>SCI Figure 1 · 研究流程图</h1>
    <p id="status">读取中…</p>
  </div>
  <select id="manuscript" title="子工程根目录的 .docx 手稿"></select>
  <button type="button" id="btn-fill">按手稿填写</button>
  <button type="button" id="btn-reload">重新加载</button>
</header>
<main>
  <aside>
    <p id="notice" hidden></p>
    <label class="fld">版式 layout
      <select id="layout">
        <option value="expanded-split-downsample">A′ expanded（预分组 + 降采样）</option>
        <option value="published-a">A published（无 Methods 行）</option>
        <option value="study">study（含 Methods 行）</option>
      </select>
    </label>

    <fieldset>
      <legend>筛查 screened</legend>
      <label class="fld">文本<textarea id="screened-text" rows="2"></textarea></label>
      <label class="fld">n <input id="screened-n" class="num" type="number" min="0"/></label>
    </fieldset>

    <fieldset>
      <legend>纳入 / 排除 criteria</legend>
      <label class="fld">inclusion（每行一条）<textarea id="inclusion" rows="4"></textarea></label>
      <label class="fld">exclusion（每行一条，可写 n=…）<textarea id="exclusion" rows="3"></textarea></label>
    </fieldset>

    <fieldset id="fs-presplit">
      <legend>预分组 presplit</legend>
      <div id="presplit-rows"></div>
      <button type="button" id="add-presplit">+ 臂</button>
    </fieldset>

    <fieldset id="fs-downsample">
      <legend>降采样 downsample</legend>
      <div id="downsample-rows"></div>
      <button type="button" id="add-downsample">+ 降采样</button>
    </fieldset>

    <fieldset>
      <legend>最终队列 cohorts</legend>
      <div id="cohort-rows"></div>
      <button type="button" id="add-cohort">+ 队列</button>
    </fieldset>

    <fieldset>
      <legend>分析人数 analyzed</legend>
      <label class="fld">文本<textarea id="analyzed-text" rows="2"></textarea></label>
      <label class="fld">n <input id="analyzed-n" class="num" type="number" min="0"/></label>
    </fieldset>

    <fieldset id="fs-pipeline" class="hidden">
      <legend>Methods 行（study）</legend>
      <label class="fld">重采样 balance
        <select id="balance">
          <option value="">无</option>
          <option value="downsample">downsample</option>
          <option value="smote">SMOTE</option>
        </select>
      </label>
      <label class="fld">balance_n <input id="balance-n" class="num" type="number" min="0"/></label>
      <label class="fld"><input type="checkbox" id="opt-lasso"/> LASSO</label>
      <label class="fld">模型（勾选即画）<span id="model-opts"></span></label>
      <label class="fld">评价（勾选即画）<span id="metric-opts"></span></label>
      <label class="fld">解释（勾选即画）<span id="explain-opts"></span></label>
    </fieldset>

    <label class="fld">阳性名称 pos_name <input id="pos-name" type="text"/></label>
    <label class="fld">备注 notes <textarea id="notes" rows="2"></textarea></label>

    <div class="row" style="margin-top:10px">
      <button type="button" class="primary" id="btn-save">保存并生成 Figure 1</button>
      <button type="button" id="btn-preview">刷新预览</button>
    </div>
    <p id="msg" aria-live="polite"></p>
  </aside>

  <section class="preview">
    <div class="preview-bar">
      <h2>交互预览</h2>
      <button type="button" id="tune">微调版式</button>
      <button type="button" id="reset">恢复默认版式</button>
      <span id="page-info"></span>
    </div>
    <div id="stage" class="stage">
      <img id="preview-img" alt="Figure 1 预览"/>
      <div id="handles"></div>
    </div>
    <p id="empty" class="empty">正在读取 Figure 1 …</p>
    <p id="warnings" class="warn"></p>
  </section>
</main>

<script>
(function () {
  "use strict";
  const LAYOUT_EXPANDED = "expanded-split-downsample";
  const LAYOUT_STUDY = "study";
  const MODELS = [["clinical", "Clinical model"], ["radiomics", "Radiomics model"], ["nomogram", "Nomogram"]];
  const METRICS = [["roc", "ROC AUC"], ["calibration", "Calibration"], ["dca", "DCA"], ["nri", "NRI"], ["idi", "IDI"]];
  const EXPLAIN = [["dag", "DAG"], ["mediation", "Mediation"]];
  const SPEC_REL = "ref/pipeline/figure1_strobe.json";

  const $ = (id) => document.getElementById(id);
  const state = {
    project: "",
    spec: null,
    overrides: { boxes: {}, edges: {}, hidden: [] },
    geometry: null,
    tune: false,
    previewBusy: false,
    previewSeq: 0,
  };

  function token() {
    let value = "";
    const meta = document.querySelector('meta[name="console-token"]');
    if (meta) value = String(meta.getAttribute("content") || "").trim();
    if (!value || value === "__CONSOLE_TOKEN__") {
      try {
        const parent = window.parent && window.parent.document;
        const pm = parent ? parent.querySelector('meta[name="console-token"]') : null;
        if (pm) value = String(pm.getAttribute("content") || "").trim();
      } catch (err) { value = ""; }
    }
    return value === "__CONSOLE_TOKEN__" ? "" : value;
  }

  async function api(path, options) {
    const opts = Object.assign({ cache: "no-store" }, options || {});
    const headers = Object.assign({}, opts.headers || {});
    const tok = token();
    if (tok) headers["X-Console-Token"] = tok;
    if (opts.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";
    const response = await fetch(path, Object.assign({}, opts, { headers }));
    let data = null;
    try { data = await response.json(); } catch (err) { data = null; }
    if (data === null) throw new Error("HTTP " + response.status);
    return data;
  }

  function setStatus(text) { $("status").textContent = text || ""; }
  function setMsg(text, bad) {
    const el = $("msg");
    el.textContent = text || "";
    el.className = bad ? "err" : "";
  }
  function setNotice(text) {
    const el = $("notice");
    el.textContent = text || "";
    el.hidden = !text;
  }
  function setWarnings(list) {
    $("warnings").textContent = (list && list.length) ? "⚠ " + list.join("；") : "";
  }
  function showPage(pageCm) {
    $("page-info").textContent = pageCm && pageCm.length
      ? "实际 " + pageCm[0].toFixed(1) + " × " + pageCm[1].toFixed(1) + " cm"
      : "";
  }
  function numOrNull(value) {
    const text = String(value == null ? "" : value).trim();
    if (!text) return null;
    const n = Number(text);
    return Number.isFinite(n) ? Math.trunc(n) : null;
  }
  function esc(value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function blankPipeline() {
    return { balance: null, balance_n: null, lasso: false, models: [], metrics: [], explain: [] };
  }
  function blankSpec() {
    return {
      schema_version: 2,
      layout: LAYOUT_EXPANDED,
      screened: { text: "", n: null },
      criteria: { inclusion: [], exclusion: [] },
      presplit: [],
      downsample: [],
      cohorts: [],
      analyzed: { text: "", n: null },
      pos_name: "positive",
      notes: "",
      overrides: { boxes: {}, edges: {}, hidden: [] },
      font_size: 12,
      pipeline: blankPipeline(),
    };
  }

  function exclusionText(item) {
    const reason = String(item && item.reason ? item.reason : "").trim();
    const n = item && item.n != null ? item.n : null;
    if (n == null) return reason;
    return reason ? reason + " (n=" + n + ")" : "(n=" + n + ")";
  }
  function parseExclusion(text) {
    return String(text || "").split(/\r?\n/).map((line) => line.trim()).filter(Boolean).map((line) => {
      const matched = line.match(/^(.*?)(?:\s*\(n\s*=\s*(\d+)\))?$/);
      const reason = (matched && matched[1] != null ? matched[1] : line).trim();
      const n = matched && matched[2] ? Number(matched[2]) : null;
      return { reason: reason, n: n };
    });
  }

  function addPresplitRow(item) {
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.kind = "presplit";
    row.innerHTML =
      '<input class="f-label" placeholder="臂标签" value="' + esc(item.label || "") + '"/>' +
      '<input class="num f-n" type="number" min="0" placeholder="n" value="' + esc(item.n == null ? "" : item.n) + '"/>' +
      '<input class="num f-pp" type="number" min="0" placeholder="阳性" value="' + esc(item.pp == null ? "" : item.pp) + '"/>' +
      '<input class="num f-nonpp" type="number" min="0" placeholder="阴性" value="' + esc(item.non_pp == null ? "" : item.non_pp) + '"/>' +
      '<button type="button" title="删除该臂">×</button>';
    row.querySelector("button").addEventListener("click", () => { row.remove(); refreshArms(); schedulePreview(); });
    $("presplit-rows").appendChild(row);
  }

  function addDownsampleRow(item) {
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.kind = "downsample";
    row.innerHTML =
      '<select class="f-arm"></select>' +
      '<input class="num f-n" type="number" min="0" placeholder="n" value="' + esc(item.n == null ? "" : item.n) + '"/>' +
      '<select class="f-class"><option value="non_pp">non_pp</option><option value="pp">pp</option></select>' +
      '<input class="f-reason" placeholder="原因" value="' + esc(item.reason || "") + '"/>' +
      '<button type="button" title="删除该降采样">×</button>';
    row.querySelector(".f-class").value = item["class"] === "pp" ? "pp" : "non_pp";
    row.querySelector("button").addEventListener("click", () => { row.remove(); schedulePreview(); });
    $("downsample-rows").appendChild(row);
    refreshArms();
  }

  function addCohortRow(item) {
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.kind = "cohort";
    row.innerHTML =
      '<input class="f-label" placeholder="队列标签" value="' + esc(item.label || "") + '"/>' +
      '<input class="num f-n" type="number" min="0" placeholder="n" value="' + esc(item.n == null ? "" : item.n) + '"/>' +
      '<input class="num f-pp" type="number" min="0" placeholder="阳性" value="' + esc(item.pp == null ? "" : item.pp) + '"/>' +
      '<input class="num f-nonpp" type="number" min="0" placeholder="阴性" value="' + esc(item.non_pp == null ? "" : item.non_pp) + '"/>' +
      '<button type="button" title="删除该队列">×</button>';
    row.querySelector("button").addEventListener("click", () => { row.remove(); schedulePreview(); });
    $("cohort-rows").appendChild(row);
  }

  function currentArms() {
    return Array.from($("presplit-rows").querySelectorAll('[data-kind="presplit"]')).map((row, index) => ({
      id: "arm-" + index,
      label: row.querySelector(".f-label").value.trim() || ("Arm " + (index + 1)),
    }));
  }

  function refreshArms() {
    const arms = currentArms();
    Array.from($("downsample-rows").querySelectorAll('[data-kind="downsample"]')).forEach((row) => {
      const select = row.querySelector(".f-arm");
      const chosen = select.value || (arms[0] && arms[0].id) || "";
      select.innerHTML = "";
      arms.forEach((arm) => {
        const option = document.createElement("option");
        option.value = arm.id;
        option.textContent = arm.label;
        select.appendChild(option);
      });
      if (arms.some((arm) => arm.id === chosen)) select.value = chosen;
    });
  }

  function renderPresplit(rows) {
    $("presplit-rows").innerHTML = "";
    (rows || []).forEach(addPresplitRow);
  }
  function renderDownsample(rows) {
    $("downsample-rows").innerHTML = "";
    (rows || []).forEach(addDownsampleRow);
    refreshArms();
  }
  function renderCohorts(rows) {
    $("cohort-rows").innerHTML = "";
    (rows || []).forEach(addCohortRow);
  }

  function checkedValues(container) {
    return Array.from(container.querySelectorAll("input[type=checkbox]"))
      .filter((input) => input.checked).map((input) => input.value);
  }
  function buildCheckboxes(container, entries, selected) {
    container.innerHTML = "";
    entries.forEach(([key, label]) => {
      const wrap = document.createElement("label");
      wrap.style.marginRight = "10px";
      const input = document.createElement("input");
      input.type = "checkbox";
      input.value = key;
      input.checked = (selected || []).indexOf(key) >= 0;
      input.addEventListener("change", schedulePreview);
      wrap.appendChild(input);
      wrap.appendChild(document.createTextNode(" " + label));
      container.appendChild(wrap);
    });
  }

  function layoutFields() {
    const layout = $("layout").value;
    $("fs-presplit").classList.toggle("hidden", layout !== LAYOUT_EXPANDED);
    $("fs-downsample").classList.toggle("hidden", layout !== LAYOUT_EXPANDED);
    $("fs-pipeline").classList.toggle("hidden", layout !== LAYOUT_STUDY);
  }

  function renderForm(spec) {
    const layout = spec.layout || LAYOUT_EXPANDED;
    $("layout").value = layout;
    $("screened-text").value = (spec.screened && spec.screened.text) || "";
    $("screened-n").value = spec.screened && spec.screened.n != null ? spec.screened.n : "";
    $("inclusion").value = ((spec.criteria && spec.criteria.inclusion) || []).join("\n");
    $("exclusion").value = ((spec.criteria && spec.criteria.exclusion) || []).map(exclusionText).join("\n");
    $("analyzed-text").value = (spec.analyzed && spec.analyzed.text) || "";
    $("analyzed-n").value = spec.analyzed && spec.analyzed.n != null ? spec.analyzed.n : "";
    $("pos-name").value = spec.pos_name || "";
    $("notes").value = spec.notes || "";
    renderPresplit(spec.presplit || []);
    renderDownsample(spec.downsample || []);
    renderCohorts(spec.cohorts || []);
    const pipeline = spec.pipeline || blankPipeline();
    $("balance").value = pipeline.balance || "";
    $("balance-n").value = pipeline.balance_n != null ? pipeline.balance_n : "";
    $("opt-lasso").checked = !!pipeline.lasso;
    buildCheckboxes($("model-opts"), MODELS, pipeline.models);
    buildCheckboxes($("metric-opts"), METRICS, pipeline.metrics);
    buildCheckboxes($("explain-opts"), EXPLAIN, pipeline.explain);
    layoutFields();
  }

  function collectSpec() {
    const layout = $("layout").value;
    const spec = state.spec ? JSON.parse(JSON.stringify(state.spec)) : blankSpec();
    spec.schema_version = 2;
    spec.layout = layout;
    spec.screened = { text: $("screened-text").value, n: numOrNull($("screened-n").value) };
    spec.criteria = {
      inclusion: $("inclusion").value.split(/\r?\n/).map((s) => s.trim()).filter(Boolean),
      exclusion: parseExclusion($("exclusion").value),
    };
    spec.analyzed = { text: $("analyzed-text").value, n: numOrNull($("analyzed-n").value) };
    spec.pos_name = $("pos-name").value.trim();
    spec.notes = $("notes").value;
    spec.overrides = state.overrides;
    if (layout === LAYOUT_EXPANDED) {
      spec.presplit = Array.from($("presplit-rows").querySelectorAll('[data-kind="presplit"]')).map((row, index) => ({
        id: "arm-" + index,
        label: row.querySelector(".f-label").value.trim() || ("Arm " + (index + 1)),
        n: numOrNull(row.querySelector(".f-n").value),
        pp: numOrNull(row.querySelector(".f-pp").value),
        non_pp: numOrNull(row.querySelector(".f-nonpp").value),
      }));
      spec.downsample = Array.from($("downsample-rows").querySelectorAll('[data-kind="downsample"]')).map((row) => ({
        arm: row.querySelector(".f-arm").value || "arm-0",
        n: numOrNull(row.querySelector(".f-n").value),
        "class": row.querySelector(".f-class").value,
        reason: row.querySelector(".f-reason").value.trim(),
      }));
    } else {
      spec.presplit = [];
      spec.downsample = [];
    }
    spec.cohorts = Array.from($("cohort-rows").querySelectorAll('[data-kind="cohort"]')).map((row, index) => ({
      id: "cohort-" + index,
      label: row.querySelector(".f-label").value.trim() || ("Cohort " + (index + 1)),
      n: numOrNull(row.querySelector(".f-n").value),
      pp: numOrNull(row.querySelector(".f-pp").value),
      non_pp: numOrNull(row.querySelector(".f-nonpp").value),
    }));
    if (layout === LAYOUT_STUDY) {
      spec.pipeline = {
        balance: $("balance").value || null,
        balance_n: numOrNull($("balance-n").value),
        lasso: $("opt-lasso").checked,
        models: checkedValues($("model-opts")),
        metrics: checkedValues($("metric-opts")),
        explain: checkedValues($("explain-opts")),
      };
    } else {
      delete spec.pipeline;
    }
    return spec;
  }

  function showEmpty(text) {
    $("empty").textContent = text;
    $("empty").classList.remove("hidden");
    $("preview-img").classList.add("hidden");
    $("handles").innerHTML = "";
  }
  function showImage() {
    $("empty").classList.add("hidden");
    $("preview-img").classList.remove("hidden");
    renderHandles();
  }

  function renderHandles() {
    const wrap = $("handles");
    wrap.innerHTML = "";
    const img = $("preview-img");
    if (!state.geometry || img.classList.contains("hidden")) return;
    const rect = img.getBoundingClientRect();
    const pageW = state.geometry.page_in[0];
    if (!rect.width || !pageW) return;
    const scale = rect.width / pageW;
    (state.geometry.boxes || []).forEach((box) => {
      const el = document.createElement("div");
      el.className = "handle";
      el.dataset.id = box.id;
      el.style.left = box.x * scale + "px";
      el.style.top = box.y * scale + "px";
      el.style.width = box.w * scale + "px";
      el.style.height = box.h * scale + "px";
      el.addEventListener("pointerdown", startDrag);
      wrap.appendChild(el);
    });
  }

  function startDrag(ev) {
    if (!state.tune || !state.geometry) return;
    ev.preventDefault();
    const id = ev.currentTarget.dataset.id;
    const box = (state.geometry.boxes || []).find((item) => item.id === id);
    if (!box) return;
    const img = $("preview-img");
    const scale = img.getBoundingClientRect().width / state.geometry.page_in[0];
    if (!scale) return;
    const startX = ev.clientX;
    const startY = ev.clientY;
    const originX = box.x;
    const originY = box.y;
    const el = ev.currentTarget;
    const move = (event) => {
      const dx = (event.clientX - startX) / scale;
      const dy = (event.clientY - startY) / scale;
      el._x = originX + dx;
      el._y = originY + dy;
      el.style.left = el._x * scale + "px";
      el.style.top = el._y * scale + "px";
    };
    const up = () => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      state.overrides.boxes[id] = {
        x: Math.round((el._x == null ? originX : el._x) * 1000) / 1000,
        y: Math.round((el._y == null ? originY : el._y) * 1000) / 1000,
      };
      schedulePreview();
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  }

  let previewTimer = null;
  function schedulePreview() {
    if (!state.project) return;
    clearTimeout(previewTimer);
    previewTimer = setTimeout(runPreview, 550);
  }

  async function runPreview() {
    if (!state.project) return;
    if (state.previewBusy) { schedulePreview(); return; }
    state.previewBusy = true;
    const seq = ++state.previewSeq;
    try {
      const spec = collectSpec();
      const data = await api("/api/flow_preview", {
        method: "POST",
        body: JSON.stringify({ project: state.project, spec: spec, overrides: state.overrides }),
      });
      if (seq !== state.previewSeq) return;
      if (!data.ok) {
        setMsg("预览失败：" + (data.error || "未知错误"), true);
        return;
      }
      state.geometry = data.geometry;
      $("preview-img").src = "data:image/png;base64," + data.png_base64;
      showImage();
      showPage(data.page_cm);
      setWarnings(data.warnings);
      setMsg("预览已更新（未保存）");
    } catch (err) {
      setMsg("预览失败：" + (err && err.message ? err.message : err), true);
    } finally {
      state.previewBusy = false;
    }
  }

  function highlightChanged(oldSpec, newSpec) {
    const pairs = [
      ["screened-text", oldSpec && oldSpec.screened && oldSpec.screened.text, newSpec.screened.text],
      ["screened-n", oldSpec && oldSpec.screened && oldSpec.screened.n, newSpec.screened.n],
      ["analyzed-text", oldSpec && oldSpec.analyzed && oldSpec.analyzed.text, newSpec.analyzed.text],
      ["analyzed-n", oldSpec && oldSpec.analyzed && oldSpec.analyzed.n, newSpec.analyzed.n],
      ["pos-name", oldSpec && oldSpec.pos_name, newSpec.pos_name],
      ["notes", oldSpec && oldSpec.notes, newSpec.notes],
    ];
    pairs.forEach(([id, before, after]) => {
      if (String(before == null ? "" : before) !== String(after == null ? "" : after)) {
        $(id).classList.add("changed");
      }
    });
    const oldInclusion = ((oldSpec && oldSpec.criteria && oldSpec.criteria.inclusion) || []).join("\n");
    if (oldInclusion !== $("inclusion").value) $("inclusion").classList.add("changed");
    const oldExclusion = ((oldSpec && oldSpec.criteria && oldSpec.criteria.exclusion) || []).map(exclusionText).join("\n");
    if (oldExclusion !== $("exclusion").value) $("exclusion").classList.add("changed");
    const rowKey = (value) => JSON.stringify({
      presplit: value && value.presplit,
      downsample: value && value.downsample,
      cohorts: value && value.cohorts,
    });
    if (rowKey(oldSpec) !== rowKey(newSpec)) {
      ["presplit-rows", "downsample-rows", "cohort-rows"].forEach((id) => $(id).classList.add("changed"));
    }
  }

  async function loadManuscripts() {
    if (!state.project) return;
    try {
      const data = await api("/flow_files?project=" + encodeURIComponent(state.project));
      const select = $("manuscript");
      select.innerHTML = "";
      ((data && data.files) || []).forEach((file) => {
        const option = document.createElement("option");
        option.value = file.name;
        option.textContent = file.name;
        select.appendChild(option);
      });
      if (data && data.default) select.value = data.default;
    } catch (err) {
      setStatus("读取手稿列表失败：" + (err && err.message ? err.message : err));
    }
  }

  async function load() {
    if (!state.project) {
      setStatus("缺少 project 参数");
      return;
    }
    setStatus("读取 " + SPEC_REL + " …");
    const data = await api("/flow_figure?project=" + encodeURIComponent(state.project));
    if (!data || !data.ok) {
      state.spec = blankSpec();
      state.overrides = { boxes: {}, edges: {}, hidden: [] };
      state.geometry = null;
      renderForm(state.spec);
      showEmpty("未生成 → 按手稿重做");
      setStatus("尚未生成：" + ((data && data.error) || "Figure 1 spec 不存在"));
      setMsg("");
      await loadManuscripts();
      return;
    }
    state.spec = data.spec || blankSpec();
    state.overrides = state.spec.overrides || { boxes: {}, edges: {}, hidden: [] };
    state.geometry = data.geometry || null;
    renderForm(state.spec);
    showPage(data.page_cm);
    setWarnings(data.warnings);
    if (data.png_exists && data.png_rel) {
      const url = "/files/" + encodeURIComponent(state.project) + "/" +
        String(data.png_rel).split("/").map(encodeURIComponent).join("/") + "?t=" + Date.now();
      $("preview-img").src = url;
      showImage();
    } else {
      showEmpty("PNG 未生成：保存后出现");
    }
    setStatus("源文件：" + (data.spec_rel || SPEC_REL) + "；改完保存，审计不过不落盘");
    await loadManuscripts();
  }

  async function save() {
    if (!state.project) return;
    clearTimeout(previewTimer);
    const spec = collectSpec();
    spec.overrides = state.overrides;
    setMsg("正在保存并重新生成 Figure 1 …（审计/渲染失败不写文件）");
    try {
      const data = await api("/api/flow_figure", {
        method: "POST",
        body: JSON.stringify({ project: state.project, spec: spec }),
      });
      if (!data.ok) { setMsg("保存失败：" + (data.error || "未知错误"), true); return; }
      const parts = ["已保存：" + (data.spec_rel || SPEC_REL)];
      if (data.png_rel) parts.push("PNG：" + data.png_rel);
      parts.push((data.results || []).length ? "结果夹 " + data.results.length + " 个" : "未找到结果夹");
      parts.push((data.patched || []).length ? "Results 已回填" : "Results 未改动");
      setMsg(parts.join("；"));
      await load();
    } catch (err) {
      setMsg("保存失败：" + (err && err.message ? err.message : err), true);
    }
  }

  async function fillFromManuscript() {
    const file = $("manuscript").value;
    if (!state.project || !file) { setMsg("先选择子工程手稿。", true); return; }
    setMsg("读取 " + file + " …");
    try {
      const data = await api("/flow_spec?project=" + encodeURIComponent(state.project) +
        "&file=" + encodeURIComponent(file));
      if (!data.ok) { setMsg((data && data.error) || "手稿解析失败", true); return; }
      const canonical = data.canonical && data.canonical.spec;
      if (!canonical) { setMsg("手稿解析没有返回 canonical spec。", true); return; }
      const oldSpec = state.spec ? JSON.parse(JSON.stringify(state.spec)) : null;
      state.spec = canonical;
      state.overrides = canonical.overrides || { boxes: {}, edges: {}, hidden: [] };
      renderForm(state.spec);
      highlightChanged(oldSpec, canonical);
      const missing = (data.missing || []).length ? "（缺：" + data.missing.join("、") + "）" : "";
      setNotice("已按 " + file + " 填写，请核对后保存" + missing);
      const problems = (data.canonical && data.canonical.problems) || [];
      if (problems.length) setMsg(problems.join("；"), true);
      else setMsg("已填入手稿字段；核对后保存。");
      schedulePreview();
    } catch (err) {
      setMsg("手稿填写失败：" + (err && err.message ? err.message : err), true);
    }
  }

  function bind() {
    $("layout").addEventListener("change", () => { layoutFields(); schedulePreview(); });
    ["screened-text", "screened-n", "inclusion", "exclusion", "analyzed-text", "analyzed-n",
      "pos-name", "notes", "balance", "balance-n", "opt-lasso"].forEach((id) => {
      $(id).addEventListener("input", schedulePreview);
      $(id).addEventListener("change", schedulePreview);
    });
    $("presplit-rows").addEventListener("input", () => { refreshArms(); schedulePreview(); });
    $("downsample-rows").addEventListener("change", schedulePreview);
    $("cohort-rows").addEventListener("input", schedulePreview);
    $("add-presplit").addEventListener("click", () => {
      addPresplitRow({ label: "", n: null, pp: null, non_pp: null });
      refreshArms(); schedulePreview();
    });
    $("add-downsample").addEventListener("click", () => {
      addDownsampleRow({ arm: (currentArms()[0] || {}).id, n: null, "class": "non_pp", reason: "" });
      schedulePreview();
    });
    $("add-cohort").addEventListener("click", () => {
      addCohortRow({ label: "", n: null, pp: null, non_pp: null });
      schedulePreview();
    });
    $("btn-save").addEventListener("click", save);
    $("btn-preview").addEventListener("click", runPreview);
    $("btn-reload").addEventListener("click", () => { load().catch((err) => setStatus(String(err))); });
    $("btn-fill").addEventListener("click", fillFromManuscript);
    $("tune").addEventListener("click", () => {
      state.tune = !state.tune;
      $("tune").classList.toggle("active", state.tune);
      $("stage").classList.toggle("tune", state.tune);
      setMsg(state.tune ? "微调版式：拖动预览框，松手后重渲染。" : "已退出微调。");
    });
    $("reset").addEventListener("click", () => {
      state.overrides = { boxes: {}, edges: {}, hidden: [] };
      setMsg("已恢复默认版式（保存后才落盘）。");
      schedulePreview();
    });
    $("preview-img").addEventListener("load", renderHandles);
    document.addEventListener("input", (event) => {
      if (event.target && event.target.classList) event.target.classList.remove("changed");
    });
    window.addEventListener("resize", renderHandles);
  }

  state.project = new URLSearchParams(location.search).get("project") || "";
  bind();
  load().catch((err) => { setStatus("读取失败：" + String(err)); setMsg(String(err), true); });
})();
</script>
</body>
</html>
