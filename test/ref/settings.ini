# RAD 工程配置（只改本文件）
# 值用 JSON：true/false/null、数字、字符串带引号、列表/对象。
# 运行: <工程名>.html   配置: ref/settings.ini   算法: <STATS_ROOT>/modules

[repro]  ; 可重复性
DO_REPRO = true
DRY_RUN = false
SEED = 66666
TRAIN_RATIO = 0.7
SPLIT_COL = ""

[io]  ; 数据与路径
DO_IO = true
INPUT = "test.xlsx"
MODULES_DIR = ""
RAD_SHEET = "rad"
CLIN_SHEET = "cln"
QC_SHEET = "qc"
ICC_SHEET = "icc"
RAD_ID_COL = "Patient_ID"
CLIN_ID_COL = "Patient_ID"
CLIN_PATH = ""
RAD_PATH = ""
LABEL_COL = ""
OUT_DIR = ""
OUTCOME_OUT_SUBDIR = true
EXTERNAL_FILE = ""
EXTERNAL_CLIN_SHEET = "cln"
EXTERNAL_RAD_SHEET = "rad"
USE_INTERNAL_SPLIT_WHEN_EXTERNAL = true
OUTCOME_COLS = ["Group"]
OUTCOME_OVERRIDES = {}
PAIRWISE_OVERRIDES = {}
SUBPROJECT_BY_OUTCOME = {}
GROUP_COL_KEYWORD = "Group"
POSITIVE_GROUP_LABEL = ""
GROUP_DISPLAY_POS = ""
GROUP_DISPLAY_NEG = ""
DO_BASELINE_ALL = true
DO_BASELINE_TRAIN_TEST = true
EXTERNAL_TESTS = []
DO_EXCLUDE_SAMPLES = false
EXCLUDE_FILE = ""
EXCLUDE_SHEET = ""
EXCLUDE_COL = ""
EXCLUDE_ROW = ""
EXCLUDE_IDS = []
READER_VALUE_MAP = {}
OUTCOME_BINARIZE = {}
GROUP_KEEP = []
PAIRWISE_GROUPS = []
PAIRWISE_ALL = false
GROUP_FROM_ID = false
GROUP_FROM_ID_SEP = "_"
GROUP_LEVEL_DISPLAY = {}
SUBGROUP_COL = ""
VAL_MODE = "lock_threshold"
SUBGROUP_VAL_MODE = ""
EXTERNAL_VAL_MODE = "lock_threshold"

[clinprep]  ; 临床 / 预处理
CLIN_FORCE_CONTINUOUS = []
CLIN_FORCE_CATEGORICAL = []
SKIP_CLIN_FEATURES = ["Patient_ID", "Group"]
ORDINAL_MAX_LEVELS = 5

[clin]  ; 临床筛选
DO_CLIN = true
DO_UNI_LOGISTIC_TABLE = true
DO_MV_LOGISTIC_TABLE = true
TABLE1_P_THRESHOLD = 0.1
FORCE_REMOVE_FEATURES = []
FORCE_INTER_FEATURES = []
FORCE_MODEL_FEATURES = []
READER_COLS = []
RAD_ID_COLS = []
DO_FIRTH = false

[ancova]  ; 协方差分析
DO_ANCOVA = false
ANCOVA_OUTCOMES = []
ANCOVA_GROUP = "Group"
ANCOVA_COVARIATES = []

[mlr]  ; 多元线性回归
DO_MLR = false
MLR_OUTCOMES = []
MLR_GROUP = "Group"
MLR_COVARIATES = []

[corr]  ; 相关热图
DO_HEATMAP = true
HEATMAP_COLS = []
CORR_GROUP = ""

[pcorr]  ; 相关/偏相关分析
DO_PARTIAL = false
PARTIAL_X = []
PARTIAL_Y = []
PARTIAL_CONTROLS = []
PARTIAL_METHOD = "spearman"
PARTIAL_GROUP = ""
DO_CORR = true
CORR_PREDICTORS = []
CORR_REFS = []
CORR_E_REF = "Age"
CORR_F_REF = "Group"

[switch]  ; 模块开关
DO_FALSE_CLASS = true
DO_FDR = false
DO_FWER = false
VIF_THRESHOLD_WARN = 5
BOOTSTRAP_N = 1000
DO_QC_REPORT = true
QC_HTML = "ref/qc.html"
DO_COMBINED_MODEL = true
DO_NOMOGRAM = true
DO_CALIBRATION = true
DO_ROC = true
ROC_MV_P_THRESHOLD = 0.05
FORCE_CLIN_FOR_ROC = []
ROC_PLOT_EXCLUDE = []
DO_DCA = true
DCA_CURVES = ["Clinical", "RadScore", "Combined"]
DO_NRI = true
NRI_CUTOFF = [0, 0.3, 0.7, 1]
NRI_MODEL_OLD = ["clinical"]
NRI_MODEL_NEW = ["combined"]
OUTCOME_READER_COMPARE = {}
READER_COMPARE_COL = null
READER_ALL_IN_ROC = false
NRI_OLD_COL = ""
NRI_NEW_COL = ""

[surv]  ; 生存曲线
DO_SURVIVAL = false
SURVIVAL_TIME_COL = ""
SURVIVAL_TIME_UNIT = "months"
DO_SURVIVAL_BY_RISK = true
DO_COX = false
DO_TIME_DEPENDENT_ROC = false
TD_IPCW_TIME_COL = ""
TD_IPCW_STATUS_COL = "ipcw_status"
TD_IPCW_HORIZONS = [3, 6, 12, 24]
DO_LANDMARK_ROC = false
TD_ROC_TIMES = ""
TD_ROC_STATUS_COLS = ""

[advanced]  ; 高级分析
DO_ADVANCED = true
DO_DAG = false
DO_SHAP = false
DO_MEDIATION = false
SHAP_MAX_SAMPLES = 200
DAG_NODES = []
DAG_EDGES = []
DAG_MEDIATION_HIGHLIGHT = []
MEDIATION_PATHS = []

[radprep]  ; 组学 / 预处理
DO_ICC_FILTER = true
ICC_REQUIRE_ROW = false
ENABLE_CORR_FILTER = true
LASSO_CACHE = true
RAD_COR_CUTOFF = 0.95
ICC_THRESHOLD = 0.75
ICC_FEATURE_COL = "Pictologics_feature"
ICC_INTRA_COL = "intra_ICC"
ICC_INTER_COL = "inter_ICC"
RAD_MARKER_SIDE = "both"
RAD_MARKER_MIN_N = 5
RAD_FEATURE_PREFIX_EXCLUDE = []
RAD_FEATURE_DISPLAY_STRIP = []
RAD_FEATURE_PREFIX_GROUP = {"names": [], "assign": {}}

[rad]  ; 组学 / LASSO
DO_LASSO = true
RAD_FEATURE_SOURCE = "both"
ALPHA = 1
LASSO_NFOLDS = 10
LASSO_N_LAMBDAS = 15
LASSO_MAX_ITER = 500
LASSO_N_JOBS = -1
LASSO_C_MAX = 50
LASSO_C_MIN = 0.001
LASSO_TOL = 0.001
LASSO_PREFILTER_TOPK = 25
LASSO_PLOT_PATH = false

[radlog]  ; 组学 / Logistic
DO_RAD_LOGISTIC = false
RAD_LOGIT_UNI_P = 0.1
RAD_LOGIT_MV_P = 0.05
DO_RAD_FIRTH = false

[fig]  ; 图与显示
DO_FIGURE_PANELS = true
DO_PLOT_TIFF = false
DO_PLOT_PDF = false
FIGURE_PANEL_DPI = 300
FIGURE_PANEL_MEDIATION_NCOLS = 2
FIGURE_PANEL_LABEL_POS = "lower_left"
FIGURE_PANEL_LABELS = null
FIGURE_PANEL_GAP_PX = 8
FIG_FONT_SIZE = 11
FIG_PALETTE = "npg"
FIG_COLORS_MAIN = ["#D55E00", "#B2182B", "#2166AC", "#762A83", "#117733"]
FIG_COLORS_AUX = ["#44AA99", "#DDCC77", "#EE8866", "#AA4499", "#332288"]
