[project]
name = "stats-analysis"
# Keep in step with modules/__init__.py __version__; tests/test_version_consistency.py enforces it.
version = "4.3.1"
description = "Reusable stats / radiomics analysis library (modules) and model-validation CLIs"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "loopnownow" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "matplotlib>=3.7",
  "joblib>=1.3",
  "openpyxl>=3.1",
  "MLstatkit>=0.1.91",
]

[project.optional-dependencies]
shap = ["shap>=0.44"]
swap-stats = ["tableone>=0.9", "dcurves>=1.1", "lifelines>=0.27"]
partial = ["pingouin>=0.5"]
swap-refs = ["pyalex>=0.21", "habanero>=2.4", "arxiv>=3.0", "bibtexparser>=2.1", "pypdf>=3.0"]
# miceforest 6.0.5 (still the latest release) calls Booster.__inner_predict(0);
# lightgbm 4.7 dropped that argument, so the pair only works below 4.7.
# Upstream bug, open at https://github.com/AnotherSamWilson/miceforest/issues/104
mi-forest = ["miceforest>=6.0.5", "lightgbm>=4.6,<4.7"]
dev = [
  "pytest>=7.4",
  "ruff>=0.12",
  'tomli>=2.0; python_version < "3.11"',
  "pyyaml>=6.0",
  # CI / modules/tests collection: packages not covered by swap-stats / partial.
  "networkx>=3.0",
  "python-docx>=1.0",
  "requests>=2.31",
  "Pillow>=10.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["modules/tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["modules*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# E402: 入口脚本先注入 sys.path / 设环境变量，再 import 本地模块
"modules/pipeline.py" = ["E402"]
"modules/console/console.py" = ["E402"]
"model-validation/compare_val_modes.py" = ["E402"]
"modules/tests/test_docx_extract.py" = ["E402"]
"tools/clean-data/tidy_paths.py" = ["E402"]
"tools/sync/batch_rerun_pipelines.py" = ["E402"]
"tools/sync/smoke_test.py" = ["E402"]
"tools/sync/sync_modules.py" = ["E402"]
# E701: 一次性抽取脚本沿用单行 if（改写会动历史清洗逻辑）
"tools/clean-data/extract_discharge.py" = ["E701"]
# F401: 模板脚手架预置 import 供使用者填写
"tools/templates/soft_code_template.py" = ["F401"]
# E402: 遗留 habitat 脚本先 sys.path.append 再 import workflow_utils / 本地模块
"tools/habitat-pipeline/utility/expand_roi_5mm.py" = ["E402"]
"tools/habitat-pipeline/utility/generate_global_habitat.py" = ["E402"]
"tools/habitat-pipeline/utility/plot_global.py" = ["E402"]
